<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
html { background: #0B0F1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0B0F1A; font-family: Arial, sans-serif; color: #FFFFFF;
  display: flex;
}
.wrap { margin: 48pt; display: flex; flex-direction: column; justify-content: center; }
.h1 { font-size: 30pt; font-weight: bold; margin-bottom: 10pt; }
ul { margin-top: 10pt; font-size: 20pt; color: #B6C0D1; line-height: 1.35; }
li { margin-bottom: 10pt; }
.accent { color: #F96D00; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="h1">默认中间件 = 即插即用能力</p>
    <ul>
      <li><span class="accent">TodoList</span>：任务拆解与进度状态</li>
      <li><span class="accent">Filesystem</span>：读写/编辑/检索与执行</li>
      <li><span class="accent">SubAgent</span>：自动生成子代理协作</li>
    </ul>
  </div>
</body>
</html>
