<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
html { background: #0B0F1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0B0F1A; font-family: Arial, sans-serif; color: #FFFFFF;
  display: flex;
}
.wrap { margin: 48pt; display: flex; flex-direction: column; justify-content: center; }
.h1 { font-size: 30pt; font-weight: bold; margin-bottom: 10pt; }
ul { margin-top: 10pt; font-size: 20pt; color: #B6C0D1; line-height: 1.35; }
li { margin-bottom: 10pt; }
.accent { color: #F96D00; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="h1">适用场景（功能驱动）</p>
    <ul>
      <li><span class="accent">研究与调研</span>：多步骤信息整合</li>
      <li><span class="accent">复杂交付</span>：跨工具、跨团队流程</li>
      <li><span class="accent">自动化运营</span>：可控执行与审计</li>
      <li><span class="accent">知识产品</span>：持续积累与复用</li>
    </ul>
  </div>
</body>
</html>
