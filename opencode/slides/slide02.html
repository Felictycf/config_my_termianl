<!DOCTYPE html>
<html>
<head>

<style>

body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0B0F1A; font-family: Arial, sans-serif; color: #FFFFFF;

</style>
</head>
<body>
  <div class="wrap">
    <p class="h1">复杂任务的最大障碍：<span class="accent">不可控</span></p>
    <p class="h2">传统 agent 在长链路、多人协作、变更目标时经常失控</p>
    <p class="h2">DeepAgents 的目标：让“复杂任务”变成可分解、可追踪、可交付</p>
  </div>

</html>
