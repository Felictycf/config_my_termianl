<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #277884;
  padding: 16pt 40pt;
}
h1 {
  color: #FFFFFF;
  font-size: 24pt;
  margin: 0;
}
.content {
  padding: 18pt;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10pt;
}
.pillar {
  background: #FFFFFF;
  padding: 10pt 20pt;
  border-left: 4pt solid #5EA8A7;
  border-radius: 6pt;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.pillar h2 {
  color: #277884;
  font-size: 15pt;
  margin: 0 0 6pt 0;
}
.pillar p {
  color: #2E4053;
  font-size: 12pt;
  margin: 0;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="header">
  <h1>DeepAgent 四大支柱</h1>
</div>
<div class="content">
  <div class="pillar">
    <h2>1. 代理状态与生命周期</h2>
    <p>管理代理的初始化、执行和终止状态,确保任务的一致性和可追溯性</p>
  </div>
  <div class="pillar">
    <h2>2. 事件系统与流式传输</h2>
    <p>基于事件的架构支持实时响应和流式输出,提供即时反馈能力</p>
  </div>
  <div class="pillar">
    <h2>3. 工具系统架构</h2>
    <p>灵活的工具注册、发现和执行机制,支持动态扩展工具能力</p>
  </div>
  <div class="pillar">
    <h2>4. 内置工具集</h2>
    <p>提供规划工具、文件系统工具、子代理委托、Web 工具等开箱即用的能力</p>
  </div>
</div>
</body>
</html>
