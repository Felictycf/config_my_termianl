<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #277884;
  padding: 20pt 40pt;
}
h1 {
  color: #FFFFFF;
  font-size: 28pt;
  margin: 0;
}
.content {
  padding: 25pt;
  flex: 1;
  display: flex;
  gap: 20pt;
}
.card {
  background: #FFFFFF;
  padding: 18pt;
  border-radius: 6pt;
  flex: 1;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}
.card-number {
  background: #5EA8A7;
  color: #FFFFFF;
  font-size: 28pt;
  font-weight: bold;
  width: 40pt;
  height: 40pt;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10pt;
}
.card h2 {
  color: #277884;
  font-size: 18pt;
  margin: 0 0 10pt 0;
}
.card p {
  color: #2E4053;
  font-size: 14pt;
  line-height: 1.3;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>核心特征</h1>
</div>
<div class="content">
  <div class="card">
    <div class="card-number"><p>1</p></div>
    <h2>自主规划</h2>
    <p>Agent 能够将复杂任务分解为子任务,制定详细计划并跟踪进度</p>
  </div>
  <div class="card">
    <div class="card-number"><p>2</p></div>
    <h2>记忆管理</h2>
    <p>将交互历史分为情景记忆、工作记忆和长期记忆,实现持久化知识</p>
  </div>
  <div class="card">
    <div class="card-number"><p>3</p></div>
    <h2>工具系统</h2>
    <p>动态发现并执行工具,支持文件系统、Web、API 等多种能力</p>
  </div>
  <div class="card">
    <div class="card-number"><p>4</p></div>
    <h2>子代理委托</h2>
    <p>为不同任务生成专门化的子代理,实现并行处理和专业化分工</p>
  </div>
</div>
</body>
</html>
