<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #277884;
  padding: 15pt 40pt;
}
h1 {
  color: #FFFFFF;
  font-size: 22pt;
  margin: 0;
}
.content {
  padding: 22pt;
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18pt;
  align-content: start;
}
.tool-card {
  background: #FFFFFF;
  padding: 12pt 18pt;
  border-radius: 6pt;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  border-top: 3pt solid #5EA8A7;
}
.tool-card h2 {
  color: #277884;
  font-size: 15pt;
  margin: 0 0 6pt 0;
}
.tool-card p {
  color: #2E4053;
  font-size: 11pt;
  margin: 0;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="header">
  <h1>内置工具集</h1>
</div>
<div class="content">
  <div class="tool-card">
    <h2>📋 规划工具</h2>
    <p>write_todos: 创建和管理任务列表,实现任务分解和进度跟踪</p>
  </div>
  <div class="tool-card">
    <h2>📁 文件系统工具</h2>
    <p>read, write, edit: 读取、写入和编辑文件,实现持久化存储</p>
  </div>
  <div class="tool-card">
    <h2>🤖 子代理委托</h2>
    <p>task: 生成专门化的子代理处理不同领域的复杂任务</p>
  </div>
  <div class="tool-card">
    <h2>⚙️ 执行工具</h2>
    <p>execute: 在受控沙箱环境中执行代码和命令</p>
  </div>
  <div class="tool-card">
    <h2>🌐 Web 工具</h2>
    <p>search, fetch: 搜索网络、获取网页内容和 API 数据</p>
  </div>
  <div class="tool-card">
    <h2>💾 存储系统</h2>
    <p>支持多种存储后端,实现数据的持久化和检索</p>
  </div>
</div>
</body>
</html>
