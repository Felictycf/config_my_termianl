<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #277884;
  padding: 14pt 40pt;
}
h1 {
  color: #FFFFFF;
  font-size: 20pt;
  margin: 0;
}
.content {
  padding: 18pt;
  flex: 1;
  display: flex;
  gap: 22pt;
}
.usecase {
  background: #FFFFFF;
  padding: 12pt;
  border-radius: 6pt;
  flex: 1;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
}
.usecase-icon {
  font-size: 36pt;
  margin-bottom: 8pt;
}
.usecase h2 {
  color: #277884;
  font-size: 16pt;
  margin: 0 0 6pt 0;
}
.usecase ul {
  margin: 0;
  padding-left: 18pt;
  flex: 1;
}
.usecase li {
  color: #2E4053;
  font-size: 11pt;
  margin-bottom: 5pt;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="header">
  <h1>应用场景</h1>
</div>
<div class="content">
  <div class="usecase">
    <div class="usecase-icon"><p>🔬</p></div>
    <h2>研究代理</h2>
    <ul>
      <li>多步骤研究和信息收集</li>
      <li>从多个来源综合信息</li>
      <li>生成研究报告和文档</li>
    </ul>
  </div>
  <div class="usecase">
    <div class="usecase-icon"><p>💻</p></div>
    <h2>编程代理</h2>
    <ul>
      <li>构建完整应用程序</li>
      <li>调试和修复代码</li>
      <li>编写和执行测试</li>
    </ul>
  </div>
  <div class="usecase">
    <div class="usecase-icon"><p>📚</p></div>
    <h2>文档处理</h2>
    <ul>
      <li>分析 PDF 和文档</li>
      <li>创建 RAG 聊天机器人</li>
      <li>生成报告和摘要</li>
    </ul>
  </div>
  <div class="usecase">
    <div class="usecase-icon"><p>⚡</p></div>
    <h2>自动化任务</h2>
    <ul>
      <li>执行 Shell 命令</li>
      <li>调用 API 和数据库</li>
      <li>自动化工作流程</li>
    </ul>
  </div>
</div>
</body>
</html>
