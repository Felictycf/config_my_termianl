# vim: ft=tmux
# Catppuccin Mocha statusline

set -g mode-style "fg=#cdd6f4,bg=#45475a"

set -g message-style "fg=#cdd6f4,bg=#45475a"
set -g message-command-style "fg=#cdd6f4,bg=#45475a"

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#a6adc8,bg=#181825"

set -g status-bg "#1e1e2e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S:#I.#P #[fg=#89b4fa,bg=#45475a,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#45475a,bold] #(whoami) #[fg=#45475a,bg=#1e1e2e]"
set -g status-right "#[fg=#181825,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#a6adc8,bg=#181825]#[fg=#45475a,bg=#181825,nobold,nounderscore,noitalics]#[fg=#a6adc8,bg=#45475a]#[fg=#45475a,bg=#45475a,nobold,nounderscore,noitalics]#[fg=#1e1e2e,bg=#89b4fa,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a6adc8,bg=#1e1e2e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a6adc8,bg=#1e1e2e"
setw -g window-status-format '#[fg=#1e1e2e,bg=#1e1e2e]#[default] #I  #{b:pane_current_path} #[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa] #I #[fg=#1e1e2e,bg=#fab387] #{b:pane_current_path} #[fg=#fab387,bg=#1e1e2e,nobold]'
