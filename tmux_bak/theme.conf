#### COLOUR (Catppuccin Mocha)

# Catppuccin Mocha colors:
# base:      #1e1e2e
# mantle:    #181825
# crust:     #11111b
# text:      #cdd6f4
# subtext0:  #a6adc8
# subtext1:  #bac2de
# surface0:  #313244
# surface1:  #45475a
# surface2:  #585b70
# overlay0:  #6c7086
# overlay1:  #7f849c
# overlay2:  #9399b2
# blue:      #89b4fa
# lavender:  #b4befe
# sapphire:  #74c7ec
# sky:       #89dceb
# teal:      #94e2d5
# green:     #a6e3a1
# yellow:    #f9e2af
# peach:     #fab387
# maroon:    #eba0ac
# red:       #f38ba8
# mauve:     #cba6f7
# pink:      #f5c2e7
# flamingo:  #f2cdcd
# rosewater: #f5e0dc

# default statusbar colors
set-option -g status-style bg=#1e1e2e,fg=#cdd6f4

# default window title colors
set-window-option -g window-status-style fg=#6c7086,bg=#1e1e2e

# active window title colors
set-window-option -g window-status-current-style fg=#f9e2af,bg=#313244,bold

# pane border
set-option -g pane-border-style fg=#313244
set-option -g pane-active-border-style fg=#89b4fa,bg=default

# message text
set-option -g message-style bg=#313244,fg=#cdd6f4

# pane number display
set-option -g display-panes-active-colour "#fab387" #peach
set-option -g display-panes-colour "#89b4fa" #blue

# clock
set-window-option -g clock-mode-colour "#a6e3a1" #green

# copy mode highlight
set-window-option -g mode-style bg=#45475a,fg=#cdd6f4

# bell
set-window-option -g window-status-bell-style bg=#f38ba8,fg=#cdd6f4
