# Terminal settings for true color support
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:Tc"
set -ag terminal-features ",xterm-256color:RGB"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

#### basic settings

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
# Enable mouse support
set -g mouse on
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g history-limit 64096

set -sg escape-time 10


# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Allow OSC 7 passthrough for terminal working directory
set -g allow-passthrough on

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/utility.conf

# Catppuccin theme
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style 'rounded'

# Window colors - use Catppuccin accent colors
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"

# Window text format
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Status line (Catppuccin modules)
set -g status-left-length 100
set -g status-right-length 100
set -gF status-left "#{E:@catppuccin_status_session}"
# Keep continuum autosave active even if later plugins rewrite status-right.
set -g status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persist and restore sessions across tmux server restarts/reboots.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
run '~/.config/tmux/plugins/tpm/tpm'
